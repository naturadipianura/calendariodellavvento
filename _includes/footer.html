<script>
  (() => {
    const box = document.getElementById('footer-player-count');
    const value = box.querySelector('strong');
    let latestRequest = 0;

    async function updatePlayerCount() {
      const request = ++latestRequest;

      try {
        const settings = await fetch(box.dataset.configUrl, {
          cache: 'no-store'
        });
        if (!settings.ok) throw new Error();

        const config = await settings.json();
        if (config.mode !== 'supabase') throw new Error();

        const response = await fetch(
          `${config.url}/rest/v1/rpc/calendar_player_count`,
          {
            method: 'POST',
            headers: {
              apikey: config.key,
              'Content-Type': 'application/json'
            },
            body: '{}',
            cache: 'no-store'
          }
        );

        if (!response.ok) throw new Error();

        const count = await response.json();
        if (!Number.isSafeInteger(count) || count < 0) {
          throw new Error();
        }

        if (request !== latestRequest) return;
        value.textContent = count.toLocaleString('it-IT');
        box.removeAttribute('title');
      } catch {
        if (request !== latestRequest) return;
        value.textContent = '—';
        box.title = 'Conteggio momentaneamente non disponibile';
      }
    }

    window.addEventListener('giapp:profile', updatePlayerCount);
    updatePlayerCount();
  })();
</script>
